<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>采购管理智能体 - 流式交互</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 20px;
        }

        .panel {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        .panel-header {
            padding: 16px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .panel-body {
            padding: 20px;
        }

        .agent-tabs {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .agent-tab {
            padding: 14px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1rem;
        }

        .agent-tab:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .agent-tab.active {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .agent-tab .icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            background: rgba(102, 126, 234, 0.1);
        }

        .agent-tab.active .icon {
            background: rgba(255,255,255,0.2);
        }

        .param-group {
            margin-bottom: 16px;
        }

        .param-label {
            display: block;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .param-input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: border-color 0.3s ease;
            background: #fafafa;
        }

        .param-input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }

        .param-hint {
            font-size: 0.75rem;
            color: #999;
            margin-top: 4px;
        }

        .btn {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        /* 响应区域 */
        .response-area {
            height: 600px;
            overflow-y: auto;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #333;
            border: 2px solid #e0e0e0;
        }

        .response-area.loading {
            background: linear-gradient(90deg, #f8f9fa 25%, #e9ecef 50%, #f8f9fa 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* 消息类型区分 */
        .message {
            margin-bottom: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            word-break: break-word;
        }

        .message-step {
            background: #e8f4ff;
            border-left: 4px solid #2196f3;
            color: #1565c0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .message-thinking {
            background: #fff8e1;
            border-left: 4px solid #ffc107;
            color: #795548;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-style: italic;
        }

        .message-content {
            background: #f1f8e9;
            border-left: 4px solid #4caf50;
            color: #2e7d32;
        }

        .message-content .markdown-body {
            color: #2e7d32;
        }

        .message-error {
            background: #ffebee;
            border-left: 4px solid #f44336;
            color: #c62828;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.8rem;
            opacity: 0.7;
        }

        .message-time {
            font-size: 0.75rem;
            color: #999;
        }

        .response-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e0e0e0;
        }

        .response-title {
            font-weight: 600;
            color: #333;
            font-size: 1.1rem;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #666;
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.3s;
            border-radius: 24px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background-color: #667eea;
        }

        input:checked + .toggle-slider:before {
            transform: translateX(20px);
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .radio-label:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .radio-label.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, #f0f4ff 0%, #f0f4ff 100%);
        }

        .radio-label input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
        }

        /* Markdown 样式 */
        .markdown-body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .markdown-body h1, .markdown-body h2, .markdown-body h3, 
        .markdown-body h4, .markdown-body h5, .markdown-body h6 {
            margin-top: 1em;
            margin-bottom: 0.5em;
            font-weight: 600;
            color: inherit;
        }

        .markdown-body h1 { font-size: 1.5em; }
        .markdown-body h2 { font-size: 1.3em; }
        .markdown-body h3 { font-size: 1.1em; }

        .markdown-body p {
            margin-bottom: 0.8em;
        }

        .markdown-body ul, .markdown-body ol {
            margin-left: 1.5em;
            margin-bottom: 0.8em;
        }

        .markdown-body li {
            margin-bottom: 0.3em;
        }

        .markdown-body code {
            background: rgba(0,0,0,0.06);
            padding: 0.2em 0.4em;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9em;
        }

        .markdown-body pre {
            background: rgba(0,0,0,0.06);
            padding: 1em;
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 0.8em;
        }

        .markdown-body pre code {
            background: none;
            padding: 0;
        }

        .markdown-body table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 0.8em;
        }

        .markdown-body th, .markdown-body td {
            border: 1px solid #ddd;
            padding: 8px 12px;
            text-align: left;
        }

        .markdown-body th {
            background: rgba(0,0,0,0.05);
            font-weight: 600;
        }

        .markdown-body blockquote {
            border-left: 4px solid #ccc;
            padding-left: 1em;
            margin-left: 0;
            color: #666;
            margin-bottom: 0.8em;
        }

        .markdown-body hr {
            border: none;
            border-top: 1px solid #ddd;
            margin: 1em 0;
        }

        .markdown-body strong {
            font-weight: 600;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a1a1a1;
        }

        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ 采购管理智能体</h1>
            <p>流式交互分析 - 实时获取智能体分析结果</p>
        </div>

        <div class="main-content">
            <div class="panel">
                <div class="panel-header">
                    🎯 智能体选择与参数配置
                </div>
                <div class="panel-body">
                    <div class="agent-tabs">
                        <div class="agent-tab active" data-agent="allocation">
                            <span class="icon">📦</span>
                            <span>智能调配</span>
                        </div>
                        <div class="agent-tab" data-agent="inventory">
                            <span class="icon">📊</span>
                            <span>库存分析</span>
                        </div>
                        <div class="agent-tab" data-agent="supplier">
                            <span class="icon">🤝</span>
                            <span>供应商匹配</span>
                        </div>
                    </div>

                    <div id="params-form">
                        <div id="allocation-params" class="params-section">
                            <div class="param-group">
                                <label class="param-label">调配策略</label>
                                <input type="text" class="param-input" id="allocation-strategy" placeholder="time/cost/stock/emerg" value="time">
                                <div class="param-hint">默认: time（时效优先）</div>
                            </div>
                            <div class="param-group">
                                <label class="param-label">仓库编码</label>
                                <input type="text" class="param-input" id="allocation-warehouse" placeholder="如: MGA0" value="MGA0">
                            </div>
                            <div class="param-group">
                                <label class="param-label">物料编码（逗号分隔）</label>
                                <input type="text" class="param-input" id="allocation-materials" placeholder="如: 500004650,500004651" value="500004650">
                            </div>
                            <div class="param-group">
                                <label class="param-label">计划类型</label>
                                <input type="text" class="param-input" id="allocation-plan-type" placeholder="如: 月度计划" value="">
                            </div>
                        </div>

                        <div id="inventory-params" class="params-section" style="display: none;">
                            <div class="param-group">
                                <label class="param-label">仓库编码</label>
                                <input type="text" class="param-input" id="inventory-warehouse" placeholder="如: MGA0，留空则查询所有仓库" value="MGA0">
                            </div>
                        </div>

                        <div id="supplier-params" class="params-section" style="display: none;">
                            <div class="param-group">
                                <label class="param-label">计划数据</label>
                                <div style="padding: 12px; background: #f0f4ff; border-radius: 8px; border: 2px solid #e0e0e0; font-size: 0.9rem; color: #667eea;">
                                    📊 系统将自动从数据库获取补货计划数据
                                </div>
                            </div>
                        </div>
                    </div>

                    <div style="display: flex; gap: 10px; margin-top: 20px;">
                        <button class="btn btn-primary" id="btn-submit">
                            <span>🚀</span>
                            <span>开始分析</span>
                        </button>
                        <button class="btn btn-secondary" id="btn-stop" style="display: none; background: #dc3545; color: white;">
                            <span>⏹️</span>
                            <span>终止</span>
                        </button>
                        <button class="btn btn-secondary" id="btn-clear">
                            <span>🗑️</span>
                            <span>清空</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    📝 智能体分析结果
                </div>
                <div class="panel-body">
                    <div class="response-header">
                        <span class="response-title" id="response-title">等待分析...</span>
                        <div style="display: flex; gap: 16px; align-items: center;">
                            <div class="toggle-container">
                                <span>显示思考过程</span>
                                <label class="toggle-switch">
                                    <input type="checkbox" id="toggle-thinking" checked>
                                    <span class="toggle-slider"></span>
                                </label>
                            </div>
                            <div class="toggle-container">
                                <span>Mock 模式</span>
                                <label class="toggle-switch">
                                    <input type="checkbox" id="toggle-mock">
                                    <span class="toggle-slider"></span>
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="response-area" id="response-area">
                        <div class="message message-step">请选择智能体并点击"开始分析"按钮，智能体将实时返回分析结果...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentAgent = 'allocation';
        let isStreaming = false;
        let showThinking = true;
        let useMock = false;
        let lastMessageDiv = null;
        let pendingContent = '';
        let parseTimeout = null;
        let currentSessionId = null;
        let abortController = null;

        // 配置marked库
        marked.setOptions({
            breaks: true,
            gfm: true,
            pedantic: false,
            sanitize: false,
            smartLists: true,
            smartypants: true
        });

        

        document.querySelectorAll('.agent-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                if (isStreaming) return;
                
                document.querySelectorAll('.agent-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentAgent = tab.dataset.agent;
                
                document.querySelectorAll('.params-section').forEach(section => {
                    section.style.display = 'none';
                });
                document.getElementById(`${currentAgent}-params`).style.display = 'block';
                
                const titles = {
                    allocation: '智能调配分析',
                    inventory: '库存分析',
                    supplier: '供应商匹配'
                };
                document.getElementById('response-title').textContent = '等待分析...';
            });
        });

        document.getElementById('btn-submit').addEventListener('click', async () => {
            if (isStreaming) return;

            const btn = document.getElementById('btn-submit');
            const stopBtn = document.getElementById('btn-stop');
            const responseArea = document.getElementById('response-area');
            showThinking = document.getElementById('toggle-thinking').checked;
            useMock = document.getElementById('toggle-mock').checked;

            // 重置会话状态
            currentSessionId = null;
            abortController = new AbortController();

            isStreaming = true;
            btn.style.display = 'none';
            stopBtn.style.display = 'flex';

            responseArea.innerHTML = '';
            responseArea.classList.add('loading');
            lastMessageDiv = null;

            const titles = {
                allocation: '智能调配分析',
                inventory: '库存分析',
                supplier: '供应商匹配'
            };
            document.getElementById('response-title').textContent = titles[currentAgent];

            try {
                const url = `/api/${currentAgent}/${currentAgent === 'allocation' ? 'match' : currentAgent === 'inventory' ? 'analyze' : 'match'}/stream`;
                const data = buildRequestData();

                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data),
                    signal: abortController.signal
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                // 直接从响应头获取会话ID（推荐方式）
                currentSessionId = response.headers.get('X-Session-Id');
                console.log('[Session] 从响应头获取会话ID:', currentSessionId);

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');

                responseArea.classList.remove('loading');

                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    processStreamChunk(chunk);
                }

                // 流结束后，强制进行一次最终解析
                if (parseTimeout) {
                    clearTimeout(parseTimeout);
                }
                if (lastMessageDiv && lastMessageDiv.classList.contains('message-content') && pendingContent) {
                    const contentDiv = lastMessageDiv.querySelector('.markdown-body');
                    if (contentDiv) {
                        try {
                            contentDiv.innerHTML = marked.parse(pendingContent);
                        } catch (e) {
                            console.error('Final markdown parse error:', e);
                        }
                    }
                }

            } catch (error) {
                if (error.name === 'AbortError') {
                    addMessage('error', '❌ 分析已终止');
                } else {
                    addMessage('error', `❌ 分析失败: ${error.message}`);
                }
            } finally {
                isStreaming = false;
                btn.style.display = 'flex';
                stopBtn.style.display = 'none';
                currentSessionId = null;
                abortController = null;
            }
        });

        // 终止按钮事件
        document.getElementById('btn-stop').addEventListener('click', async () => {
            if (!isStreaming) return;

            const stopBtn = document.getElementById('btn-stop');
            stopBtn.disabled = true;
            stopBtn.innerHTML = '<span>⏳</span><span>终止中...</span>';

            // 1. 先尝试通过API发送终止信号
            if (currentSessionId) {
                try {
                    const response = await fetch(`/api/session/${currentSessionId}/stop`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });
                    if (response.ok) {
                        console.log('[Stop] 终止信号已发送:', currentSessionId);
                    }
                } catch (e) {
                    console.error('[Stop] 发送终止信号失败:', e);
                }
            }

            // 2. 取消fetch请求
            if (abortController) {
                abortController.abort();
            }

            stopBtn.disabled = false;
            stopBtn.innerHTML = '<span>⏹️</span><span>终止</span>';
        });

        function processStreamChunk(chunk) {
            // 检查是否是步骤信息（以特定emoji开头）
            const stepPrefixes = ['🔍', '✅', '📋', '📦', '🤝', '🤖', '📊', '━━━━━━━━━━━━━━━━'];
            const isStep = stepPrefixes.some(prefix => chunk.startsWith(prefix));
            
            if (isStep) {
                addMessage('step', chunk);
            } else if (chunk.startsWith('❌')) {
                addMessage('error', chunk);
            } else {
                // LLM返回的内容，直接追加到content
                appendToContent(chunk);
            }
        }

        function appendToContent(text) {
            if (!lastMessageDiv || !lastMessageDiv.classList.contains('message-content')) {
                lastMessageDiv = null;
                addMessage('content', text);
                return;
            }
            
            const originalSpan = lastMessageDiv.querySelector('.original-content');
            const contentDiv = lastMessageDiv.querySelector('.markdown-body');
            
            if (!originalSpan || !contentDiv) {
                addMessage('content', text);
                return;
            }
            
            // 累积内容
            pendingContent += text;
            originalSpan.textContent = pendingContent;
            
            // 立即更新显示（打字机效果）
            try {
                contentDiv.innerHTML = marked.parse(pendingContent);
            } catch (e) {
                console.error('Markdown parse error:', e);
                contentDiv.textContent = pendingContent;
            }
            scrollToBottom();
        }

        function addMessage(type, content) {
            const responseArea = document.getElementById('response-area');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message message-${type}`;
            
            const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            const typeLabels = {
                step: '📋 步骤信息',
                thinking: '💭 思考过程',
                content: '📝 分析结果',
                error: '❌ 错误'
            };
            
            let contentHtml;
            if (type === 'content') {
                // 重置累积内容
                pendingContent = content;
                contentHtml = `<span style="display: none;" class="original-content">${content}</span><div class="markdown-body">${marked.parse(content)}</div>`;
            } else {
                contentHtml = `<pre style="white-space: pre-wrap; word-break: break-word; margin: 0; font-family: inherit;">${escapeHtml(content)}</pre>`;
            }
            
            messageDiv.innerHTML = `
                <div class="message-header">
                    <span>${typeLabels[type]}</span>
                    <span class="message-time">${time}</span>
                </div>
                ${contentHtml}
            `;
            responseArea.appendChild(messageDiv);
            
            lastMessageDiv = messageDiv;
            
            scrollToBottom();
        }

        function scrollToBottom() {
            const responseArea = document.getElementById('response-area');
            responseArea.scrollTo({
                top: responseArea.scrollHeight,
                behavior: 'smooth'
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('btn-clear').addEventListener('click', () => {
            if (isStreaming) return;
            
            document.getElementById('response-area').innerHTML = '<div class="message message-step">请选择智能体并点击"开始分析"按钮，智能体将实时返回分析结果...</div>';
            document.getElementById('response-title').textContent = '等待分析...';
            lastMessageDiv = null;
        });

        function buildRequestData() {
            switch (currentAgent) {
                case 'allocation':
                    return {
                        strategy: document.getElementById('allocation-strategy').value || 'time',
                        warehouseCode: document.getElementById('allocation-warehouse').value || '',
                        sourceType: '',
                        projectUnit: '',
                        demandStartDate: '',
                        demandEndDate: '',
                        planType: document.getElementById('allocation-plan-type').value || '',
                        materialCodes: parseCommaList(document.getElementById('allocation-materials').value),
                        mock: useMock
                    };
                case 'inventory':
                    return {
                        warehouseCode: document.getElementById('inventory-warehouse').value || '',
                        mock: useMock
                    };
                case 'supplier':
                    return {
                        mock: useMock
                    };
                default:
                    return {};
            }
        }

        function parseCommaList(text) {
            if (!text || !text.trim()) return null;
            return text.split(',').map(item => item.trim()).filter(item => item);
        }
    </script>
</body>
</html>

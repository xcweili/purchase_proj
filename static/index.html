<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>采购管理智能体 - 流式交互</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 20px;
        }

        .panel {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        .panel-header {
            padding: 16px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .panel-body {
            padding: 20px;
        }

        .agent-tabs {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .agent-tab {
            padding: 14px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1rem;
        }

        .agent-tab:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .agent-tab.active {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .agent-tab .icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            background: rgba(102, 126, 234, 0.1);
        }

        .agent-tab.active .icon {
            background: rgba(255,255,255,0.2);
        }

        .param-group {
            margin-bottom: 16px;
        }

        .param-label {
            display: block;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .param-input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: border-color 0.3s ease;
            background: #fafafa;
        }

        .param-input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }

        .param-hint {
            font-size: 0.75rem;
            color: #999;
            margin-top: 4px;
        }

        .btn {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        /* 响应区域 */
        .response-area {
            height: 600px;
            overflow-y: auto;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #333;
            word-break: break-all;
            border: 2px solid #e0e0e0;
        }

        .response-area.loading {
            background: linear-gradient(90deg, #f8f9fa 25%, #e9ecef 50%, #f8f9fa 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* 消息类型区分 */
        .message {
            margin-bottom: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message-step {
            background: #e8f4ff;
            border-left: 4px solid #2196f3;
            color: #1565c0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .message-thinking {
            background: #fff8e1;
            border-left: 4px solid #ffc107;
            color: #795548;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-style: italic;
        }

        .message-content {
            background: #f1f8e9;
            border-left: 4px solid #4caf50;
            color: #2e7d32;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .message-error {
            background: #ffebee;
            border-left: 4px solid #f44336;
            color: #c62828;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.8rem;
            opacity: 0.7;
        }

        .message-time {
            font-size: 0.75rem;
            color: #999;
        }

        .response-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e0e0e0;
        }

        .response-title {
            font-weight: 600;
            color: #333;
            font-size: 1.1rem;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #666;
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.3s;
            border-radius: 24px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background-color: #667eea;
        }

        input:checked + .toggle-slider:before {
            transform: translateX(20px);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a1a1a1;
        }

        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ 采购管理智能体</h1>
            <p>流式交互分析 - 实时获取智能体分析结果</p>
        </div>

        <div class="main-content">
            <!-- 左侧面板：参数输入 -->
            <div class="panel">
                <div class="panel-header">
                    🎯 智能体选择与参数配置
                </div>
                <div class="panel-body">
                    <div class="agent-tabs">
                        <div class="agent-tab active" data-agent="allocation">
                            <span class="icon">📦</span>
                            <span>智能调配</span>
                        </div>
                        <div class="agent-tab" data-agent="inventory">
                            <span class="icon">📊</span>
                            <span>库存分析</span>
                        </div>
                        <div class="agent-tab" data-agent="supplier">
                            <span class="icon">🤝</span>
                            <span>供应商匹配</span>
                        </div>
                    </div>

                    <div id="params-form">
                        <div id="allocation-params" class="params-section">
                            <div class="param-group">
                                <label class="param-label">调配策略</label>
                                <input type="text" class="param-input" id="allocation-strategy" placeholder="time/cost/stock/emerg" value="time">
                                <div class="param-hint">默认: time（时效优先）</div>
                            </div>
                            <div class="param-group">
                                <label class="param-label">仓库编码</label>
                                <input type="text" class="param-input" id="allocation-warehouse" placeholder="如: MGA0">
                            </div>
                            <div class="param-group">
                                <label class="param-label">物料编码（逗号分隔）</label>
                                <input type="text" class="param-input" id="allocation-materials" placeholder="如: 500004650,500004651">
                            </div>
                            <div class="param-group">
                                <label class="param-label">计划类型</label>
                                <input type="text" class="param-input" id="allocation-plan-type" placeholder="如: 月度计划">
                            </div>
                        </div>

                        <div id="inventory-params" class="params-section" style="display: none;">
                            <div class="param-group">
                                <label class="param-label">开始日期</label>
                                <input type="text" class="param-input" id="inventory-start" placeholder="格式: YYYYMM">
                            </div>
                            <div class="param-group">
                                <label class="param-label">结束日期</label>
                                <input type="text" class="param-input" id="inventory-end" placeholder="格式: YYYYMM">
                            </div>
                            <div class="param-group">
                                <label class="param-label">库存层级（逗号分隔）</label>
                                <input type="text" class="param-input" id="inventory-levels" placeholder="区域库/周转库/终端库">
                            </div>
                            <div class="param-group">
                                <label class="param-label">物料编码（逗号分隔）</label>
                                <input type="text" class="param-input" id="inventory-materials" placeholder="如: 500004650">
                            </div>
                        </div>

                        <div id="supplier-params" class="params-section" style="display: none;">
                            <div class="param-group">
                                <label class="param-label">计划数据（JSON格式）</label>
                                <textarea class="param-input" id="supplier-plans" rows="6" placeholder='[{"planId": "P001", "materialCode": "500004650", "demandQty": 100, "unitPrice": 100.0}...]'></textarea>
                                <div class="param-hint">留空则从数据库获取</div>
                            </div>
                        </div>
                    </div>

                    <div style="display: flex; gap: 10px; margin-top: 20px;">
                        <button class="btn btn-primary" id="btn-submit">
                            <span>🚀</span>
                            <span>开始分析</span>
                        </button>
                        <button class="btn btn-secondary" id="btn-clear">
                            <span>🗑️</span>
                            <span>清空</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 右侧面板：响应显示 -->
            <div class="panel">
                <div class="panel-header">
                    📝 智能体分析结果
                </div>
                <div class="panel-body">
                    <div class="response-header">
                        <span class="response-title" id="response-title">等待分析...</span>
                        <div class="toggle-container">
                            <span>显示思考过程</span>
                            <label class="toggle-switch">
                                <input type="checkbox" id="toggle-thinking" checked>
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                    </div>
                    <div class="response-area" id="response-area">
                        <div class="message message-step">请选择智能体并点击"开始分析"按钮，智能体将实时返回分析结果...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentAgent = 'allocation';
        let isStreaming = false;
        let accumulatedContent = '';
        let lastMessageDiv = null;

        // 智能体切换
        document.querySelectorAll('.agent-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                if (isStreaming) return;
                
                document.querySelectorAll('.agent-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentAgent = tab.dataset.agent;
                
                document.querySelectorAll('.params-section').forEach(section => {
                    section.style.display = 'none';
                });
                document.getElementById(`${currentAgent}-params`).style.display = 'block';
                
                const titles = {
                    allocation: '智能调配分析',
                    inventory: '库存分析',
                    supplier: '供应商匹配'
                };
                document.getElementById('response-title').textContent = '等待分析...';
            });
        });

        // 提交按钮
        document.getElementById('btn-submit').addEventListener('click', async () => {
            if (isStreaming) return;
            
            const btn = document.getElementById('btn-submit');
            const responseArea = document.getElementById('response-area');
            const showThinking = document.getElementById('toggle-thinking').checked;
            
            isStreaming = true;
            btn.disabled = true;
            btn.innerHTML = '<span class="typing-indicator"><span></span><span></span><span></span></span><span>分析中...</span>';
            
            responseArea.innerHTML = '';
            responseArea.classList.add('loading');
            accumulatedContent = '';
            lastMessageDiv = null;
            
            const titles = {
                allocation: '智能调配分析',
                inventory: '库存分析',
                supplier: '供应商匹配'
            };
            document.getElementById('response-title').textContent = titles[currentAgent];
            
            try {
                const url = `/api/${currentAgent}/${currentAgent === 'allocation' ? 'match' : currentAgent === 'inventory' ? 'analyze' : 'match'}/stream`;
                const data = buildRequestData();
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                
                responseArea.classList.remove('loading');
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    processStreamChunk(chunk, showThinking);
                }
                
            } catch (error) {
                addMessage('error', `❌ 分析失败: ${error.message}`);
            } finally {
                isStreaming = false;
                btn.disabled = false;
                btn.innerHTML = '<span>🚀</span><span>开始分析</span>';
            }
        });

        // 处理流式数据块
        function processStreamChunk(chunk, showThinking) {
            const responseArea = document.getElementById('response-area');
            
            // 检测消息类型
            if (chunk.startsWith('🔍') || chunk.startsWith('✅') || chunk.startsWith('📋') || 
                chunk.startsWith('📦') || chunk.startsWith('🤝') || chunk.startsWith('🤖') ||
                chunk.startsWith('━━━━━━━━━━━━━━━━')) {
                // 步骤信息
                addMessage('step', chunk);
            } else if (chunk.startsWith('❌')) {
                // 错误信息
                addMessage('error', chunk);
            } else if (accumulatedContent.startsWith('<') || detectThinking(accumulatedContent + chunk)) {
                // 可能是思考过程
                if (showThinking) {
                    addMessage('thinking', chunk);
                }
                accumulatedContent += chunk;
            } else {
                // 最终内容
                if (lastMessageDiv && lastMessageDiv.classList.contains('message-content')) {
                    lastMessageDiv.textContent += chunk;
                } else {
                    addMessage('content', chunk);
                }
                accumulatedContent = '';
            }
            
            responseArea.scrollTop = responseArea.scrollHeight;
        }

        // 检测是否是思考过程
        function detectThinking(text) {
            const thinkingIndicators = ['思考', '分析', '推理', '考虑', '可能', '或许', '看起来', '我认为'];
            return thinkingIndicators.some(indicator => text.includes(indicator)) && text.length < 200;
        }

        // 添加消息
        function addMessage(type, content) {
            const responseArea = document.getElementById('response-area');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message message-${type}`;
            
            const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            const typeLabels = {
                step: '📋 步骤信息',
                thinking: '💭 思考过程',
                content: '📝 分析结果',
                error: '❌ 错误'
            };
            
            messageDiv.innerHTML = `<div class="message-header"><span>${typeLabels[type]}</span><span class="message-time">${time}</span></div>${content}`;
            responseArea.appendChild(messageDiv);
            
            lastMessageDiv = messageDiv;
        }

        // 清空按钮
        document.getElementById('btn-clear').addEventListener('click', () => {
            if (isStreaming) return;
            
            document.getElementById('response-area').innerHTML = '<div class="message message-step">请选择智能体并点击"开始分析"按钮，智能体将实时返回分析结果...</div>';
            document.getElementById('response-title').textContent = '等待分析...';
            accumulatedContent = '';
            lastMessageDiv = null;
        });

        // 构建请求数据
        function buildRequestData() {
            switch (currentAgent) {
                case 'allocation':
                    return {
                        strategy: document.getElementById('allocation-strategy').value || 'time',
                        warehouseCode: document.getElementById('allocation-warehouse').value || '',
                        sourceType: '',
                        projectUnit: '',
                        demandStartDate: '',
                        demandEndDate: '',
                        planType: document.getElementById('allocation-plan-type').value || '',
                        materialCodes: parseCommaList(document.getElementById('allocation-materials').value)
                    };
                case 'inventory':
                    return {
                        startDate: document.getElementById('inventory-start').value || null,
                        endDate: document.getElementById('inventory-end').value || null,
                        inventoryLevels: parseCommaList(document.getElementById('inventory-levels').value),
                        materialCodes: parseCommaList(document.getElementById('inventory-materials').value),
                        seasonFactorWeight: null,
                        safetyRedundancyRatio: null
                    };
                case 'supplier':
                    const plansText = document.getElementById('supplier-plans').value;
                    let plans = null;
                    if (plansText.trim()) {
                        try {
                            plans = JSON.parse(plansText);
                        } catch (e) {
                            console.warn('Invalid JSON, sending empty');
                        }
                    }
                    return {
                        plans: plans
                    };
                default:
                    return {};
            }
        }

        // 解析逗号分隔列表
        function parseCommaList(text) {
            if (!text || !text.trim()) return null;
            return text.split(',').map(item => item.trim()).filter(item => item);
        }
    </script>
</body>
</html>
